[package]
name = "transcribe-stt"
version = "0.2.0"
edition = "2021"
description = "Terminal speech-to-text client for whisper.cpp voice models with Metal acceleration"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
whisper-rs = { version = "0.16", features = ["metal", "log_backend"] }
ratatui = "0.29"
crossterm = { version = "0.28", features = ["bracketed-paste"] }
symphonia = { version = "0.5", features = ["aac", "mp3", "isomp4", "alac", "aiff"] }
rubato = "0.16"
anyhow = "1"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
textwrap = "0.16"
sysinfo = "0.39"
libc = "0.2.186"
percent-encoding = "2.3"
ureq = "2"

[profile.release]
lto = "thin"
